name: Diagnose YouTube

# On-demand only. Prints per-video YouTube Analytics rows (with content type)
# next to public view counts, so Shorts discrepancies can be understood from
# the run log. Deploys nothing.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth google-auth-oauthlib google-api-python-client requests
      - name: Write credential files from secrets
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube_token.json
      - name: Diagnose
        env:
          DASHBOARD_HEADLESS: "1"
        run: python diagnose_youtube.py
